# BT/Nginx full site config for Xiaoxiang Log.
# Use this as the site config for https://www.xiaoxianglog.cn/.

server
{
    listen 80;
    listen 443 ssl;
    server_name www.xiaoxianglog.cn xiaoxianglog.cn 47.122.112.242;

    root C:/wwwroot/dist;
    index index.html index.htm default.html;

    include C:/BtSoft/nginx/conf/mime.types;
    default_type application/octet-stream;

    types {
        application/manifest+json webmanifest;
    }

    #HTTP_TO_HTTPS_START
    if ($server_port !~ 443) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END

    #SSL-INFO-START
    ssl_certificate     C:/BtSoft/panel/vhost/cert/47.122.112.242/fullchain.pem;
    ssl_certificate_key C:/BtSoft/panel/vhost/cert/47.122.112.242/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;
    #SSL-INFO-END

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        default_type text/html;
    }

    location ~* \.html$ {
        default_type text/html;
    }

    location ~* \.css$ {
        default_type text/css;
    }

    location ~* \.(js|mjs)$ {
        default_type application/javascript;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location = /app-update.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Cache-Control, Content-Type" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Daily Echo keeps a short-lived SSE subscription open while the durable
    # server-side job continues independently. Disable proxy buffering here so
    # partial text reaches the browser immediately instead of at response end.
    location ^~ /api/daily-echo/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /purge(/.*) {
        proxy_cache_purge cache_one $1$is_args$args;
    }

    # Disabled because BaoTa rewrite configs often define another location /,
    # which conflicts with the SPA fallback above.
    # include rewrite/47.122.112.242/*.conf;
    include redirect/47.122.112.242/*.conf;
    include static_cache/47.122.112.242/*.conf;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ~ \.well-known {
        allow all;
    }

    access_log  C:/BtSoft/wwwlogs/47.122.112.242.log;
    error_log   C:/BtSoft/wwwlogs/47.122.112.242.error.log;
}
