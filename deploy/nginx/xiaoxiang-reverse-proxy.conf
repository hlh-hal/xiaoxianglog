# BT/Nginx reverse proxy snippet for Xiaoxiang Log.
# Paste these location blocks into the site server block.
#
# Important:
# - Keep proxy_pass for /uploads without a trailing slash.
# - This preserves /uploads/images/example.jpg when forwarding to Node:
#   http://127.0.0.1:3001/uploads/images/example.jpg

types {
    application/manifest+json webmanifest;
}

location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
